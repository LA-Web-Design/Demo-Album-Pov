<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Álbum POV</title>
    <style>
        body { background: #14051c; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #22022b; padding: 25px; border-radius: 20px; text-align: left; border: 1px solid rgba(255,255,255,0.1); width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h2 { color: #00d4ff; font-size: 1.1rem; margin-bottom: 15px; text-align: center; }
        label { font-size: 0.75rem; color: #d0c0e0; display: block; margin-top: 10px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 10px; border: none; font-size: 0.9rem; box-sizing: border-box; }
        select, input { background: #14051c; color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); outline: none; }
        .checkbox-container { display: flex; align-items: center; margin-top: 12px; font-size: 0.8rem; color: #d0c0e0; cursor: pointer; }
        .checkbox-container input { width: auto; margin-right: 8px; cursor: pointer; }
        button { background: #a83bf6; color: #fff; cursor: pointer; font-weight: bold; margin-top: 18px; box-shadow: 0 4px 12px rgba(168,59,246,0.4); }
        button:hover { filter: brightness(1.1); }
        #msg { margin-top: 12px; font-size: 0.8rem; color: #75f992; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>CONFIGURACIÓN DE EVENTO</h2>
        
        <label>Versión del Servicio:</label>
        <select id="selectModo" onchange="actualizarModoDefault()">
            <option value="lite">Versión LITE (Solo Fotos)</option>
            <option value="pro">Versión PRO (Fotos, Videos, Textos)</option>
            <option value="top">Versión TOP (Con Validación)</option>
        </select>

        <label class="checkbox-container">
            <input type="checkbox" id="checkValidar"> Activar validación por lista de invitados
        </label>

        <label>ID Sheet Google Sheet (Invitados TOP):</label>
        <input type="text" id="inputSheetInvitados" placeholder="Ej: 1AbCdeF...">

        <label>ID Carpeta Google Drive (FOTOS):</label>
        <input type="text" id="inputFotos" placeholder="Ej: 1Jb9NRQ8...">

        <label>ID Carpeta Google Drive (VIDEOS):</label>
        <input type="text" id="inputVideos" placeholder="Ej: 1nNQ4KHE...">

        <label>URL de la Web (GitHub Pages):</label>
        <input type="text" id="inputUrlAppScript" placeholder="https://script.google.com/.../exec">

        <label>ID Imagen de Fondo (ej: tapiz.jpg):</label>
        <input type="text" id="inputFondo" placeholder="Ej: 1AbCdeF...">

        <button onclick="guardar()">GUARDAR CONFIGURACIÓN</button>
        <div id="msg"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5cRu4QOgrVq--Wp6a_u4N3sbe6Nebsujchjg0zoyl_-ypu5VS0Xn1LnGna02w0w7NwA/exec";

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('inputUrlAppScript').value = WEB_APP_URL;
            
            fetch(`${WEB_APP_URL}?accion=obtenerConfiguracion`)
                .then(res => res.json())
                .then(config => {
                    if(config.modo) document.getElementById('selectModo').value = config.modo;
                    if(config.sheetInvitadosId) document.getElementById('inputSheetInvitados').value = config.sheetInvitadosId;
                    if(config.folderFotos) document.getElementById('inputFotos').value = config.folderFotos;
                    if(config.folderVideos) document.getElementById('inputVideos').value = config.folderVideos;
                    if(config.fondoId) document.getElementById('inputFondo').value = config.fondoId;
                    
                    if(config.validarLista !== undefined) {
                        document.getElementById('checkValidar').checked = config.validarLista;
                    } else {
                        document.getElementById('checkValidar').checked = (config.modo === 'top');
                    }
                })
                .catch(err => {
                    document.getElementById('msg').innerText = "Error cargando configuración.";
                });
        });

        function actualizarModoDefault() {
            const modo = document.getElementById('selectModo').value;
            document.getElementById('checkValidar').checked = (modo === 'top');
        }

        function guardar() {
            const modo = document.getElementById('selectModo').value;
            const validarLista = document.getElementById('checkValidar').checked;
            const sheetInvitadosId = document.getElementById('inputSheetInvitados').value.trim();
            const fotos = document.getElementById('inputFotos').value.trim();
            const videos = document.getElementById('inputVideos').value.trim();
            const urlApp = document.getElementById('inputUrlAppScript').value.trim();
            const fondoId = document.getElementById('inputFondo').value.trim();
            
            document.getElementById('msg').innerText = "Guardando...";

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    tipo: "configuracion",
                    modo: modo,
                    validarLista: validarLista,
                    folderFotos: fotos,
                    folderVideos: videos,
                    urlApp: urlApp,
                    fondoId: fondoId,
                    sheetInvitadosId: sheetInvitadosId
                })
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('msg').innerText = "¡Configuración guardada con éxito!";
            })
            .catch(err => {
                document.getElementById('msg').innerText = "Error al guardar.";
            });
        }
    </script>
</body>
</html>
