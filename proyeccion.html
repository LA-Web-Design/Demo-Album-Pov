<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyección en Vivo - Álbum POV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #0b0b0b; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #fff; }
        
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
        }

        /* Contenedor multimedia unificado y de tamaño estricto para evitar desbordes */
        .media-container {
            position: relative;
            width: 82vw;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .media-container img, 
        .media-container video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Diseño de textos elegante y moderno tipo tarjeta flotante cinematográfica */
        .text-card {
            background: linear-gradient(135deg, rgba(20,20,20,0.9), rgba(40,40,40,0.8));
            border-left: 6px solid #e50914;
            padding: 40px 60px;
            border-radius: 16px;
            max-width: 70vw;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }

        .text-card h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: #f5f5f5;
            line-height: 1.2;
        }

        .text-card p {
            font-size: 1.8rem;
            color: #aaa;
            font-style: italic;
            font-weight: 400;
        }

        /* Overlay inferior minimalista para autor y dedicatoria en fotos/videos */
        .meta-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            padding: 30px 40px 20px 40px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .meta-author {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ff3366;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .meta-detalle {
            font-size: 1.3rem;
            font-weight: 300;
            color: #e0e0e0;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .no-content {
            font-size: 2rem;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="stage">
        <div id="pantalla" class="no-content">Cargando transmisión en vivo...</div>
    </div>

    <script>
        const URL_BACKEND = "https://script.google.com/macros/s/AKfycbz5cRu4QOgrVq--Wp6a_u4N3sbe6Nebsujchjg0zoyl_-ypu5VS0Xn1LnGna02w0w7NwA/exec"; 
        let playlist = [];
        let currentIndex = 0;
        let intervaloRotacion = null;

        async function cargarContenido() {
            try {
                const response = await fetch(`${URL_BACKEND}?accion=obtenerContenido`);
                const data = await response.json();
                const aprobados = data.filter(item => item.estado === "APROBADO");
                
                if (aprobados.length > 0) {
                    // Verificamos si cambió el set de datos para reiniciar el ciclo de forma limpia
                    if (playlist.length !== aprobados.length) {
                        playlist = aprobados;
                        if (currentIndex >= playlist.length) currentIndex = 0;
                    } else {
                        playlist = aprobados;
                    }
                }
            } catch (error) {
                console.error("Error sincronizando contenido:", error);
            }
        }

        function mostrarSiguiente() {
            if (playlist.length === 0) {
                document.getElementById("pantalla").innerHTML = `<div class="no-content">Esperando momentos de la fiesta...</div>`;
                return;
            }

            const item = playlist[currentIndex];
            const stage = document.querySelector(".stage");
            
            let contenidoHTML = "";

            if (item.tipo === "FOTO") {
                contenidoHTML = `
                    <div class="media-container">
                        <img src="${item.url}" alt="Foto en vivo">
                        <div class="meta-overlay">
                            <span class="meta-author">${escapeHtml(item.autor)}</span>
                            ${item.detalle ? `<span class="meta-detalle">${escapeHtml(item.detalle)}</span>` : ''}
                        </div>
                    </div>`;
            } else if (item.tipo === "VIDEO") {
                // Se configura para autoplay directo, muteado por políticas de navegador y bucle para reproducción fluida
                contenidoHTML = `
                    <div class="media-container">
                        <video src="${item.url}" autoplay muted playsinline onended="siguienteItemDirecto()"></video>
                        <div class="meta-overlay">
                            <span class="meta-author">${escapeHtml(item.autor)}</span>
                            ${item.detalle ? `<span class="meta-detalle">${escapeHtml(item.detalle)}</span>` : ''}
                        </div>
                    </div>`;
            } else if (item.tipo === "TEXTO") {
                contenidoHTML = `
                    <div class="text-card">
                        <h1>${escapeHtml(item.detalle)}</h1>
                        <p>— ${escapeHtml(item.autor)}</p>
                    </div>`;
            }

            stage.innerHTML = contenidoHTML;

            // Si es foto o texto, programamos el cambio automático a los 8 segundos. Si es video, el evento onended maneja la transición.
            if (item.tipo !== "VIDEO") {
                if (intervaloRotacion) clearTimeout(intervaloRotacion);
                intervaloRotacion = setTimeout(() => {
                    currentIndex = (currentIndex + 1) % playlist.length;
                    mostrarSiguiente();
                }, 8000);
            }
        }

        function siguienteItemDirecto() {
            if (intervaloRotacion) clearTimeout(intervaloRotacion);
            currentIndex = (currentIndex + 1) % playlist.length;
            mostrarSiguiente();
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Inicialización y bucles de sincronización de fondo
        async function init() {
            await cargarContenido();
            mostrarSiguiente();
            
            // Recargar datos desde el servidor cada 15 segundos sin cortar la reproducción actual
            setInterval(cargarContenido, 15000);
            
            // Rotación general de respaldo por si algún video se extiende o traba
            setInterval(() => {
                if(playlist.length > 0) {
                    currentIndex = (currentIndex + 1) % playlist.length;
                }
            }, 30000);
        }

        init();
    </script>
</body>
</html>
