<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALBUM POV EN VIVO - Proyección</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; }
        body { background: #14051c; color: #fff; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { background: #22022b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.1rem; color: #00d4ff; letter-spacing: 1px; text-transform: uppercase; }
        
        .controls-bar { display: flex; gap: 8px; align-items: center; font-size: 0.8rem; flex-wrap: wrap; }
        .controls-bar select, .controls-bar button { padding: 6px 10px; border-radius: 8px; border: none; background: #a83bf6; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .controls-bar button:hover { background: #bc62f8; }
        .controls-bar select { background: #14051c; color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); }

        .main-layout { display: flex; flex: 1; min-height: calc(100vh - 65px); width: 100%; transition: all 0.3s ease; }
        
        /* Pantalla Gigante Principal */
        .stage { flex: 3; background: #000; display: flex; justify-content: center; align-items: center; position: relative; border-right: 2px solid #22022b; min-height: 50vh; overflow: hidden; cursor: pointer; transition: flex 0.3s ease; }
        
        .media-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            overflow: hidden;
        }

        .media-container img, .media-container video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .stage-text { font-size: 2.2rem; text-align: center; padding: 30px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 2; }
        .author-tag { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 10px; font-size: 0.9rem; color: #00d4ff; border: 1px solid rgba(0,212,255,0.3); z-index: 10; pointer-events: none; }

        /* Botón flotante minimalista para alternar modo presentación limpia */
        .btn-fullscreen-toggle {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(34, 2, 43, 0.85);
            color: #00d4ff;
            border: 1px solid rgba(0,212,255,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-fullscreen-toggle:hover { background: #a83bf6; color: #fff; }

        /* Panel de Control / Operador */
        .operator-panel { 
            flex: 1; 
            background: #1c0626; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            gap: 12px; 
            min-width: 300px; 
            overflow-y: auto; 
            transition: all 0.3s ease; 
        }
        .panel-section-title { font-size: 0.75rem; text-transform: uppercase; color: #d0c0e0; letter-spacing: 1px; margin-bottom: 4px; }
        
        .mini-card { background: #22022b; border-radius: 10px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .mini-screen { width: 100%; height: 120px; background: #000; border-radius: 6px; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; margin-bottom: 6px; }
        .mini-screen img, .mini-screen video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .mini-screen span { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

        /* Estructura de la Botonera Simétrica */
        .playback-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .playback-row { display: flex; gap: 6px; justify-content: center; }
        
        .btn-ctrl { 
            flex: 1; 
            color: #fff; 
            border: 1px solid rgba(0,212,255,0.3); 
            padding: 8px 5px; 
            border-radius: 6px; 
            font-size: 0.75rem; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center;
            transition: background 0.2s;
            background: #3c095c;
        }
        .btn-ctrl:hover { background: #5a189a; }
        
        /* Estados de Color del Botón Play/Pausa */
        .btn-ctrl.state-play { background: #2bb84b; border-color: #4ce66d; }
        .btn-ctrl.state-pause { background: #b8972b; border-color: #ffd700; color: #fff; }
        .btn-ctrl.state-stop { background: #555555; border-color: #777777; }

        .moderation-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-approve { flex: 1; background: #2bb84b; color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-reject { flex: 1; background: #d93838; color: #fff; border: none; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        
        .queue-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; max-height: 180px; overflow-y: auto; }
        .queue-item { background: #14051c; padding: 8px; border-radius: 6px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
        .queue-item.active-item { border-color: #00d4ff; background: #240833; }

        /* Footer integrado y alineado al fondo */
        .footer-divider { width: 100%; height: 2px; background: rgba(0, 0, 0, 0.8); margin: 15px 0 10px 0; }
        .footer-text { color: #00d4ff; font-size: 0.7rem; text-align: center; line-height: 1.45; opacity: 0.9; }

        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .stage { min-height: 45vh; border-right: none; border-bottom: 2px solid #22022b; }
            .operator-panel { width: 100%; min-width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ALBUM POV - Proyección</h1>
        <div class="controls-bar">
            <label style="font-size: 0.75rem;"><input type="checkbox" id="checkModerar" onchange="toggleModeracion()"> Moderar</label>
            <span>Velocidad:</span>
            <select id="selectVelocidad" onchange="cambiarVelocidad()">
                <option value="6000">6s</option>
                <option value="8000" selected>8s</option>
                <option value="12000">12s</option>
            </select>
        </div>
    </header>

    <div class="main-layout" id="mainLayout">
        <!-- PANTALLA GIGANTE CON BOTÓN FLOTANTE Y EVENTO TÁCTIL -->
        <div class="stage" id="stageContainer" onclick="avanzarSlideManual()">
            <button class="btn-fullscreen-toggle" id="btnModeToggle" onclick="event.stopPropagation(); toggleModoPresentacionLimpia()" title="Alternar Modo Proyección Limpia">⛶ Pantalla Completa</button>
            <span style="color: rgba(255,255,255,0.3); font-size: 1.2rem;">Cargando contenido...</span>
        </div>

        <!-- PANEL DE OPERADOR -->
        <div class="operator-panel" id="operatorPanel">
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Botonera de Control Optimizada y Simétrica en 2 Filas -->
                <div class="mini-card" style="padding: 8px;">
                    <div class="panel-section-title">Controles de Reproducción</div>
                    <div class="playback-grid">
                        <div class="playback-row">
                            <button class="btn-ctrl" onclick="event.stopPropagation(); retrocederSlide()" title="Anterior">◀ Anterior</button>
                            <button class="btn-ctrl state-play" id="btnPlayPause" onclick="event.stopPropagation(); alternarPlayPause()" title="Play / Pausa">Play / Pausa</button>
                            <button class="btn-ctrl" onclick="event.stopPropagation(); avanzarSlideManual()" title="Siguiente">Siguiente ▶</button>
                        </div>
                        <div class="playback-row">
                            <button class="btn-ctrl" onclick="event.stopPropagation(); irAlPrimero()" title="Primero">⏮ Primero</button>
                            <button class="btn-ctrl state-stop" id="btnStop" onclick="event.stopPropagation(); pararReproduccion()" title="Stop">⏹ Stop</button>
                            <button class="btn-ctrl" onclick="event.stopPropagation(); irAlUltimo()" title="Último">⏭ Último</button>
                        </div>
                    </div>
                </div>

                <div class="mini-card">
                    <div class="panel-section-title">Lo que está al aire (En vivo)</div>
                    <div class="mini-screen" id="miniCurrent">
                        <span>Sin señal</span>
                    </div>
                    <div id="currentAuthorInfo" style="font-size: 0.75rem; color: #00d4ff;">Autor: -</div>
                </div>

                <div class="mini-card" id="previewCard" style="display: none;">
                    <div class="panel-section-title">Vista Previa (Siguiente Pendiente)</div>
                    <div class="mini-screen" id="miniPreview">
                        <span>Sin pendientes</span>
                    </div>
                    <div id="previewAuthorInfo" style="font-size: 0.75rem; color: #fffd8d;">Autor: -</div>
                    <div class="moderation-actions">
                        <button class="btn-approve" onclick="event.stopPropagation(); moderarActual('APROBADO')">Aprobar</button>
                        <button class="btn-reject" onclick="event.stopPropagation(); moderarActual('RECHAZADO')">Rechazar</button>
                    </div>
                </div>

                <div>
                    <div class="panel-section-title">Cola de elementos recientes</div>
                    <div class="queue-list" id="queueList"></div>
                </div>
            </div>

            <!-- Footer integrado abajo de todo -->
            <div>
                <div class="footer-divider"></div>
                <div class="footer-text">Diseño de Luis Alberto Cáceres<br>Código de Gemini © 2026</div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5cRu4QOgrVq--Wp6a_u4N3sbe6Nebsujchjg0zoyl_-ypu5VS0Xn1LnGna02w0w7NwA/exec";

        let listaContenidos = [];
        let currentIndex = 0;
        let isPlaying = true;
        let modoModeracion = false;
        let intervaloSlides = 8000;
        let timer = null;
        let videoTimeout = null;
        let modoLimpioActivo = false;

        function toggleModoPresentacionLimpia() {
            modoLimpioActivo = !modoLimpioActivo;
            const panel = document.getElementById('operatorPanel');
            const btn = document.getElementById('btnModeToggle');

            if (modoLimpioActivo) {
                panel.style.display = 'none';
                btn.innerText = '🗗 Salir de Completa';
            } else {
                panel.style.display = 'flex';
                btn.innerText = '⛶ Pantalla Completa';
            }
        }

        function limpiarUrlDrive(url) {
            if (!url) return '';
            if (url.includes('drive.google.com')) {
                let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return `https://docs.google.com/uc?export=download&id=${match[1]}`;
                }
            }
            return url;
        }

        function toggleModeracion() {
            modoModeracion = document.getElementById('checkModerar').checked;
            document.getElementById('previewCard').style.display = modoModeracion ? 'block' : 'none';
            sincronizarContenidos();
        }

        function sincronizarContenidos() {
            fetchContenidos();
        }

        function alternarPlayPause() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btnPlayPause');
            
            btn.classList.remove('state-play', 'state-pause', 'state-stop');

            if (isPlaying) {
                btn.classList.add('state-play'); // Verde
                iniciarLoop();
            } else {
                btn.classList.add('state-pause'); // Amarillo
                clearInterval(timer);
                if (videoTimeout) clearTimeout(videoTimeout);
            }
        }

        function pararReproduccion() {
            isPlaying = false;
            clearInterval(timer);
            if (videoTimeout) clearTimeout(videoTimeout);
            
            const btn = document.getElementById('btnPlayPause');
            btn.classList.remove('state-play', 'state-pause');
            btn.classList.add('state-stop'); // Apaga el verde/amarillo del play/pause

            const stage = document.getElementById('stageContainer');
            const btnHtml = stage.querySelector('#btnModeToggle') ? stage.querySelector('#btnModeToggle').outerHTML : '';
            stage.innerHTML = btnHtml + `<span style="color: rgba(255,255,255,0.4); font-size: 1.2rem;">Reproducción detenida (Stop)</span>`;
        }

        function cambiarVelocidad() {
            intervaloSlides = parseInt(document.getElementById('selectVelocidad').value);
            if (isPlaying) iniciarLoop();
        }

        function fetchContenidos() {
            fetch(`${WEB_APP_URL}?accion=obtenerContenido`)
                .then(res => res.json())
                .then(data => {
                    listaContenidos = data;
                    actualizarColaUI();
                    if (listaContenidos.length > 0 && (currentIndex === 0 || currentIndex >= listaContenidos.length) && document.getElementById('stageContainer').querySelector('span')) {
                        renderizarPantalla(listaContenidos[0]);
                    }
                })
                .catch(err => console.error("Error al obtener contenido", err));
        }

        setInterval(fetchContenidos, 5000);
        window.addEventListener('DOMContentLoaded', () => {
            fetchContenidos();
            const btn = document.getElementById('btnPlayPause');
            btn.classList.add('state-play'); // Arranca en verde
            iniciarLoop();
        });

        function iniciarLoop() {
            clearInterval(timer);
            let filtrados = obtenerElementosAProyectar();
            if (filtrados.length > 0 && filtrados[currentIndex] && filtrados[currentIndex].tipo !== 'VIDEO') {
                programarSiguienteSlide(intervaloSlides);
            }
        }

        function programarSiguienteSlide(tiempo) {
            clearInterval(timer);
            if (!isPlaying) return;
            timer = setInterval(() => {
                avanzarSlideManual();
            }, tiempo);
        }

        function avanzarSlideManual() {
            let filtrados = obtenerElementosAProyectar();
            if (filtrados.length === 0) return;

            currentIndex = (currentIndex + 1) % filtrados.length;
            renderizarPantalla(filtrados[currentIndex]);
        }

        function retrocederSlide() {
            let filtrados = obtenerElementosAProyectar();
            if (filtrados.length === 0) return;

            currentIndex = (currentIndex - 1 + filtrados.length) % filtrados.length;
            renderizarPantalla(filtrados[currentIndex]);
        }

        function irAlPrimero() {
            let filtrados = obtenerElementosAProyectar();
            if (filtrados.length === 0) return;
            currentIndex = 0;
            renderizarPantalla(filtrados[currentIndex]);
        }

        function irAlUltimo() {
            let filtrados = obtenerElementosAProyectar();
            if (filtrados.length === 0) return;
            currentIndex = filtrados.length - 1;
            renderizarPantalla(filtrados[currentIndex]);
        }

        function obtenerElementosAProyectar() {
            if (modoModeracion) {
                return listaContenidos.filter(item => item.estado === 'APROBADO');
            } else {
                return listaContenidos; 
            }
        }

        function renderizarPantalla(item) {
            const stage = document.getElementById('stageContainer');
            const miniCurrent = document.getElementById('miniCurrent');
            if (!item) return;

            if (videoTimeout) {
                clearTimeout(videoTimeout);
                videoTimeout = null;
            }

            document.getElementById('currentAuthorInfo').innerText = `Autor: ${item.autor}`;
            let urlLimpia = limpiarUrlDrive(item.url);

            let htmlContent = '';
            let miniHtml = '';

            if (item.tipo === 'TEXTO') {
                htmlContent = `<div class="stage-text">"${item.detalle}"<br><span style="font-size:1.2rem; color:#00d4ff;">- ${item.autor}</span></div>`;
                miniHtml = `<span style="font-size:0.7rem; padding:5px;">${item.detalle}</span>`;
                if (isPlaying) programarSiguienteSlide(intervaloSlides);
            } else if (item.tipo === 'VIDEO') {
                htmlContent = `<div class="media-container"><video id="activeVideo" src="${urlLimpia}" autoplay muted playsinline preload="auto"></video></div>`;
                miniHtml = `<video src="${urlLimpia}" muted></video>`;
            } else {
                htmlContent = `<div class="media-container"><img src="${urlLimpia}" alt="Foto"></div>`;
                miniHtml = `<img src="${urlLimpia}" alt="Miniatura">`;
                if (isPlaying) programarSiguienteSlide(intervaloSlides);
            }

            const btnHtml = stage.querySelector('#btnModeToggle').outerHTML;
            stage.innerHTML = btnHtml + htmlContent + `<div class="author-tag">📷 ${item.autor}</div>`;
            miniCurrent.innerHTML = miniHtml;

            if (item.tipo === 'VIDEO') {
                const videoElement = document.getElementById('activeVideo');
                if (videoElement) {
                    videoElement.load();
                    videoElement.play().catch(e => console.log("Restricción de autoplay en video:", e));
                    
                    videoElement.onended = () => {
                        if (isPlaying) avanzarSlideManual();
                    };

                    videoTimeout = setTimeout(() => {
                        if (isPlaying) {
                            avanzarSlideManual();
                        }
                    }, Math.max(intervaloSlides, 15000));
                }
            }

            actualizarColaUI();
            if (modoModeracion) actualizarVistaPrevia();
        }

        function actualizarVistaPrevia() {
            let pendientes = listaContenidos.filter(item => item.estado === 'PENDIENTE');
            const miniPreview = document.getElementById('miniPreview');
            const previewInfo = document.getElementById('previewAuthorInfo');

            if (pendientes.length > 0) {
                let next = pendientes[0];
                previewInfo.innerText = `Autor: ${next.autor} (${next.tipo})`;
                let urlLimpiaNext = limpiarUrlDrive(next.url);
                if (next.tipo === 'TEXTO') {
                    miniPreview.innerHTML = `<span style="font-size:0.7rem; padding:5px;">${next.detalle}</span>`;
                } else if (next.tipo === 'VIDEO') {
                    miniPreview.innerHTML = `<video src="${urlLimpiaNext}" muted></video>`;
                } else {
                    miniPreview.innerHTML = `<img src="${urlLimpiaNext}">`;
                }
            } else {
                miniPreview.innerHTML = `<span>No hay pendientes</span>`;
                previewInfo.innerText = `Autor: -`;
            }
        }

        function moderarActual(nuevoEstado) {
            let pendientes = listaContenidos.filter(item => item.estado === 'PENDIENTE');
            if (pendientes.length === 0) return;
            let target = pendientes[0];

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    tipo: "moderar",
                    rowIndex: target.rowIndex,
                    nuevoEstado: nuevoEstado
                })
            })
            .then(res => res.json())
            .then(res => {
                fetchContenidos();
            });
        }

        function actualizarColaUI() {
            const queueList = document.getElementById('queueList');
            queueList.innerHTML = '';
            let filtrados = obtenerElementosAProyectar();

            listaContenidos.slice(-10).reverse().forEach(item => {
                let div = document.createElement('div');
                div.className = 'queue-item';
                if (filtrados[currentIndex] && filtrados[currentIndex].rowIndex === item.rowIndex) {
                    div.classList.add('active-item');
                }
                div.innerHTML = `<span><b>${item.autor}</b> (${item.tipo})</span> <span style="color:${item.estado==='APROBADO'?'#2bb84b':item.estado==='RECHAZADO'?'#d93838':'#fffd8d'}">${item.estado}</span>`;
                queueList.appendChild(div);
            });
            if (modoModeracion) actualizarVistaPrevia();
        }
    </script>
</body>
</html>
