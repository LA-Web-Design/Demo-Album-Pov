<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALBUM POV EN VIVO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
            background-color: #1D89F5; background-image: url('tapiz.jpg'); background-position: center; background-size: cover;
        }
        .card {
            width: 100%; max-width: 380px; padding: 30px 22px 20px 22px; border-radius: 28px;
            background-color: #22022b !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.3);
            display: flex; flex-direction: column; align-items: center; text-align: center; position: relative;
        }
        h2 { color: #ffffff; font-size: 1.25rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
        .versions-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; width: 100%; }
        .versions-label { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); text-transform: uppercase; font-weight: 600; }
        .version-pill { font-size: 0.65rem; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.25); }
        .version-pill.active { color: #00d4ff; background: rgba(0, 212, 255, 0.1); border-color: rgba(0, 212, 255, 0.35); }
        p.subtitle { color: #d1b4e8; font-size: 0.88rem; margin-bottom: 20px; line-height: 1.4; }
        .input-container { width: 100%; margin-bottom: 12px; }
        .input-autor {
            width: 100%; height: 48px; background-color: #14051c !important; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 0 18px; color: #00d4ff !important; font-size: 0.95rem; outline: none; text-align: center;
        }
        .input-autor::placeholder { color: rgba(255, 255, 255, 0.35); }
        .input-help { color: rgba(255, 255, 255, 0.55); font-size: 0.72rem; margin-bottom: 18px; display: block; }
        .fixed-header {
            background: #14051c; border: 1px solid rgba(0, 212, 255, 0.3); padding: 10px 15px; border-radius: 16px;
            margin-bottom: 15px; color: #00d4ff; font-size: 0.95rem; text-align: center; width: 100%;
        }
        .btn-action {
            display: flex; justify-content: flex-start; align-items: center; width: 100%; height: 50px;
            padding: 0 20px; font-size: 0.82rem; font-weight: 800; text-transform: uppercase; border-radius: 25px;
            border: none; cursor: pointer; margin-bottom: 15px; text-decoration: none; white-space: nowrap;
        }
        .btn-action span { text-align: center; width: 100%; margin-right: 20px; }
        .btn-action svg { margin-right: 12px; flex-shrink: 0; }
        .btn-continuar { justify-content: center; background: #1a0724; color: rgba(255, 255, 255, 0.25); cursor: not-allowed; }
        .btn-continuar.active { background: linear-gradient(180deg, #7a22b8, #380859); color: #ffffff; cursor: pointer; }
        .btn-select { background: linear-gradient(180deg, #0f5ba6, #05254a); color: #ffffff; }
        .btn-select.disabled-mode { background: #111a13 !important; color: rgba(255,255,255,0.2) !important; cursor: not-allowed; pointer-events: none; }
        .btn-submit { background: linear-gradient(180deg, #135d23, #083312); color: #ffffff; display: flex !important; }
        .btn-submit:disabled { background: #111a13 !important; color: rgba(255, 255, 255, 0.25) !important; cursor: not-allowed; pointer-events: none; }
        .btn-reset { background: linear-gradient(180deg, #135d23, #083312); color: #ffffff; display: none !important; }
        #counter-badge { font-size: 0.85rem; color: #75f992; font-weight: 600; margin-bottom: 12px; min-height: 1.2em; }
        input[type="file"] { display: none; }
        #status-msg { margin-top: 10px; font-size: 0.85rem; font-weight: 600; min-height: 1.2em; width: 100%; }
        .hidden { display: none !important; }
        .footer-divider { width: 100%; height: 2px; background: rgba(0, 0, 0, 0.8); margin: 25px 0 15px 0; }
        .footer-text { color: #00d4ff; font-size: 0.7rem; text-align: center; line-height: 1.45; opacity: 0.9; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: #22022b; border: 1px solid rgba(255,255,255,0.15); width: 85%; max-width: 310px; border-radius: 20px; padding: 20px; text-align: center; }
        .modal-title { color: #ffffff; font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; }
        .modal-body { color: #d0c0e0; font-size: 0.85rem; line-height: 1.4; margin-bottom: 18px; }
        .modal-btn { background: #00d4ff; color: #0b1a2d; font-weight: 800; border: none; padding: 8px 24px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>ALBUM POV EN VIVO</h2>
    <div class="versions-row">
        <span class="versions-label">Versión:</span>
        <div id="pillLite" class="version-pill">Lite</div>
        <div id="pillPro" class="version-pill">Pro</div>
        <div id="pillTop" class="version-pill">Top</div>
    </div>
    
    <!-- PASO 1 -->
    <div id="step-name" style="width: 100%;">
        <p class="subtitle">Subí tus fotos, videos o dejanos tu mensaje</p>
        <div class="input-container"><input type="text" id="inputNombre" class="input-autor" placeholder="Nombre" maxlength="30" oninput="validarCampos()" autocomplete="off"></div>
        <div class="input-container"><input type="text" id="inputApellido" class="input-autor" placeholder="Apellido" maxlength="30" oninput="validarCampos()" autocomplete="off"></div>
        <span class="input-help">Ingresa tu nombre y apellido para continuar</span>
        <button type="button" id="btnContinuar" class="btn-action btn-continuar" disabled onclick="continuarPanel()"><span>EMPEZAR</span></button>
    </div>

    <!-- PASO 2 -->
    <div id="step-upload" class="hidden" style="width: 100%;">
        <div class="fixed-header" id="displayNombre"></div>
        <p class="subtitle">Tomá fotos, subí videos o dejanos tu saludo (Máx. 5 ítems por envío).</p>

        <div id="upload-section" style="width: 100%;">
            <div id="seccionCamara">
                <label for="cameraInput" id="labelCamera" class="btn-action btn-select">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <span>Tomar Foto</span>
                </label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment">
            </div>

            <div id="seccionVideos">
                <label for="videoInput" id="labelVideo" class="btn-action btn-select">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    <span>Grabar Video (Máx 20s)</span>
                </label>
                <input type="file" id="videoInput" accept="video/*" capture="environment">
            </div>

            <div id="seccionGaleria">
                <label for="galleryInput" id="labelGallery" class="btn-action btn-select">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span>Galería (Fotos/Videos)</span>
                </label>
                <input type="file" id="galleryInput" accept="image/*,video/*" multiple>
            </div>

            <div class="input-container" id="seccionTexto">
                <textarea id="inputTexto" class="input-autor" placeholder="Escribe un mensaje opcional..." style="height: 70px; padding-top: 12px; resize: none; border-radius: 16px;" maxlength="250" oninput="actualizarInterfaz()"></textarea>
            </div>

            <div id="counter-badge"></div>

            <button id="submitBtn" class="btn-action btn-submit" disabled onclick="enviarTodo()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                <span>ENVIAR</span>
            </button>
        </div>
    </div>

    <button id="resetBtn" class="btn-action btn-reset" onclick="reiniciarPanel()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Subir más contenido</span>
    </button>

    <div id="status-msg"></div>
    <div class="footer-divider"></div>
    <div class="footer-text">Diseño de Luis Alberto Cáceres<br>Código de Gemini © 2026</div>
</div>

<div class="modal-overlay" id="customModal">
    <div class="modal-box">
        <div class="modal-title">ALBUM POV EN VIVO dice:</div>
        <div class="modal-body" id="modalText">Mensaje</div>
        <button class="modal-btn" onclick="cerrarModal()">Aceptar</button>
    </div>
</div>

<script>
    let WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz5cRu4QOgrVq--Wp6a_u4N3sbe6Nebsujchjg0zoyl_-ypu5VS0Xn1LnGna02w0w7NwA/exec";
    let modoGlobal = "pro";
    let validarListaGlobal = false;
    let archivosAcumulados = [];
    let nombreUsuario = '';
    const LIMITE_MAXIMO = 5;

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const videoInput = document.getElementById('videoInput');
    const submitBtn = document.getElementById('submitBtn');
    const resetBtn = document.getElementById('resetBtn');
    const counterBadge = document.getElementById('counter-badge');
    const statusMsg = document.getElementById('status-msg');
    const inputTexto = document.getElementById('inputTexto');

    window.addEventListener('DOMContentLoaded', () => {
        fetch(`${WEB_APP_URL}?accion=obtenerConfiguracion`)
            .then(res => res.json())
            .then(config => {
                if (config.modo) { modoGlobal = config.modo; aplicarRestriccionesModo(modoGlobal); }
                if (config.validarLista !== undefined) { validarListaGlobal = config.validarLista; }
                if (config.fondoId) { document.body.style.backgroundImage = `url('https://lh3.googleusercontent.com/d/${config.fondoId}')`; }
            }).catch(err => console.error(err));
    });

    function aplicarRestriccionesModo(modo) {
        if (modo === 'lite') {
            document.getElementById('pillLite').classList.add('active');
            document.getElementById('seccionVideos').style.display = 'none';
            document.getElementById('seccionTexto').style.display = 'none';
        } else if (modo === 'pro') {
            document.getElementById('pillPro').classList.add('active');
        } else if (modo === 'top') {
            document.getElementById('pillTop').classList.add('active');
        }
    }

    function mostrarModal(msg) { document.getElementById('modalText').innerText = msg; document.getElementById('customModal').classList.add('active'); }
    function cerrarModal() { document.getElementById('customModal').classList.remove('active'); }

    function validarCampos() {
        const nombre = document.getElementById('inputNombre').value.trim();
        const apellido = document.getElementById('inputApellido').value.trim();
        const btn = document.getElementById('btnContinuar');
        if (nombre && apellido) { btn.removeAttribute('disabled'); btn.classList.add('active'); }
        else { btn.setAttribute('disabled', 'true'); btn.classList.remove('active'); }
    }

    function continuarPanel() {
        const nombre = document.getElementById('inputNombre').value.trim();
        const apellido = document.getElementById('inputApellido').value.trim();
        if (!nombre || !apellido) return;
        nombreUsuario = `${nombre} ${apellido}`;
        
        if (validarListaGlobal) {
            statusMsg.style.color = "#fffd8d"; statusMsg.innerText = "Verificando...";
            fetch(`${WEB_APP_URL}?accion=validarInvitado&nombre=${encodeURIComponent(nombre)}&apellido=${encodeURIComponent(apellido)}`)
                .then(res => res.json()).then(res => {
                    statusMsg.innerText = "";
                    if (res.status === "success") abrirPanelUpload();
                    else mostrarModal(res.message);
                }).catch(() => { statusMsg.innerText = ""; mostrarModal("Error de conexión."); });
        } else { abrirPanelUpload(); }
    }

    function abrirPanelUpload() {
        document.getElementById('displayNombre').textContent = nombreUsuario;
        document.getElementById('step-name').classList.add('hidden');
        document.getElementById('step-upload').classList.remove('hidden');
    }

    cameraInput.addEventListener('change', (e) => { procesarNuevosArchivos(e.target.files); cameraInput.value = ''; });
    galleryInput.addEventListener('change', (e) => { procesarNuevosArchivos(e.target.files); galleryInput.value = ''; });
    videoInput.addEventListener('change', (e) => { procesarNuevosArchivos(e.target.files); videoInput.value = ''; });

    function procesarNuevosArchivos(nuevosFiles) {
        if (archivosAcumulados.length + nuevosFiles.length > LIMITE_MAXIMO) {
            mostrarModal(`Solo puedes acumular un máximo de ${LIMITE_MAXIMO} archivos por envío para garantizar una subida exitosa.`);
            return;
        }
        for (let file of nuevosFiles) { archivosAcumulados.push(file); }
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const textoEscrito = inputTexto ? inputTexto.value.trim() : "";
        let fotos = archivosAcumulados.filter(f => f.type.startsWith('image/')).length;
        let videos = archivosAcumulados.filter(f => f.type.startsWith('video/')).length;
        let desc = [];

        if (fotos > 0) desc.push(`${fotos} foto(s)`);
        if (videos > 0) desc.push(`${videos} video(s)`);
        if (textoEscrito) desc.push(`1 texto`);

        if (archivosAcumulados.length > 0 || textoEscrito) {
            counterBadge.innerText = `📂 Seleccionado: ${desc.join(', ')}`;
            submitBtn.removeAttribute('disabled');
        } else {
            counterBadge.innerText = "";
            submitBtn.setAttribute('disabled', 'true');
        }

        if (archivosAcumulados.length >= LIMITE_MAXIMO) {
            document.getElementById('labelCamera').classList.add('disabled-mode');
            document.getElementById('labelVideo').classList.add('disabled-mode');
            document.getElementById('labelGallery').classList.add('disabled-mode');
        } else {
            document.getElementById('labelCamera').classList.remove('disabled-mode');
            document.getElementById('labelVideo').classList.remove('disabled-mode');
            document.getElementById('labelGallery').classList.remove('disabled-mode');
        }
        statusMsg.innerText = "";
    }

    function setFormDisabled(disabled) {
        submitBtn.disabled = disabled;
        cameraInput.disabled = disabled;
        galleryInput.disabled = disabled;
        videoInput.disabled = disabled;
        if(inputTexto) inputTexto.disabled = disabled;
    }

    async function enviarTodo() {
        const textoEscrito = inputTexto ? inputTexto.value.trim() : "";
        if (archivosAcumulados.length === 0 && !textoEscrito) return;

        setFormDisabled(true);
        let okFotos = 0, okVideos = 0, okTexto = 0, rechazadas = 0;
        let total = archivosAcumulados.length + (textoEscrito ? 1 : 0);
        let actual = 0;

        for (let file of archivosAcumulados) {
            actual++;
            statusMsg.style.color = "#fffd8d";
            statusMsg.innerText = `Subiendo archivo ${actual} de ${total}...`;

            try {
                let parts = nombreUsuario.split(" ");
                let payload = {};
                if (file.type.startsWith('image/')) {
                    payload = { tipo: 'foto', file: await comprimirImagen(file), name: file.name, mimeType: 'image/jpeg', nombre: parts[0], apellido: parts.slice(1).join(" ") };
                    okFotos++;
                } else if (file.type.startsWith('video/')) {
                    payload = { tipo: 'video', file: await leerBase64(file), name: file.name, mimeType: file.type, nombre: parts[0], apellido: parts.slice(1).join(" ") };
                    okVideos++;
                }
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
            } catch (err) { rechazadas++; }
        }

        if (textoEscrito) {
            actual++;
            statusMsg.style.color = "#fffd8d";
            statusMsg.innerText = `Enviando texto...`;
            try {
                let parts = nombreUsuario.split(" ");
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ tipo: 'texto', contenido: textoEscrito, nombre: parts[0], apellido: parts.slice(1).join(" ") }) });
                okTexto = 1;
            } catch (err) { rechazadas++; }
        }

        statusMsg.style.color = "#75f992";
        statusMsg.innerHTML = `✨ ¡LISTO! Enviados: ${okFotos} foto(s), ${okVideos} video(s) y ${okTexto} texto.` + (rechazadas > 0 ? ` <span style="color:#ff6b6b;">(${rechazadas} error)</span>` : '');
        submitBtn.style.setProperty('display', 'none', 'important');
        resetBtn.style.setProperty('display', 'flex', 'important');
    }

    function reiniciarPanel() {
        archivosAcumulados = [];
        statusMsg.innerText = "";
        counterBadge.innerText = "";
        if(inputTexto) inputTexto.value = "";
        setFormDisabled(false);
        submitBtn.setAttribute('disabled', 'true');
        resetBtn.style.setProperty('display', 'none', 'important');
        submitBtn.style.setProperty('display', 'flex', 'important');
        document.getElementById('labelCamera').classList.remove('disabled-mode');
        document.getElementById('labelVideo').classList.remove('disabled-mode');
        document.getElementById('labelGallery').classList.remove('disabled-mode');
    }

    function leerBase64(file) {
        return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = e => rej(e); r.readAsDataURL(file); });
    }

    function comprimirImagen(file) {
        return new Promise((res) => {
            const r = new FileReader(); r.readAsDataURL(file);
            r.onload = (e) => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    const MAX = 1000;
                    if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(canvas.toDataURL('image/jpeg', 0.80));
                };
            };
        });
    }
</script>
</body>
</html>
